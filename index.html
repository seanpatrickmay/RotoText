<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>RotoText</title>
  </head>
  <body>
    <header id="topbar">
      <button type="button" id="follow-toggle" aria-pressed="true">Following you</button>
    </header>
    <main id="stage">
      <div class="text-box" id="corrected-box">
        <h1 class="headline" id="corrected">Read me from anywhere</h1>
      </div>
    </main>
    <svg id="scene" aria-hidden="true"></svg>
    <svg id="game" aria-hidden="true"></svg>
    <div id="game-hud" hidden></div>
    <p id="banner" hidden></p>
    <div id="calibrate" role="dialog" aria-label="Calibrate camera" hidden></div>
    <aside id="inset"></aside>
    <details id="debug">
      <summary>Tune</summary>
      <div id="debug-body"></div>
    </details>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
